<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <!-- Basic -->
        <meta charset="utf-8"/>
        <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
        <!-- Mobile Metas -->
        <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
        <!-- Site Metas -->
        <meta content="" name="keywords"/>
        <meta content="" name="description"/>
        <meta content="" name="author"/>

        <title>Point Exam</title>

        <!-- bootstrap core css -->
        <link href="/css/bootstrap.css" rel="stylesheet" type="text/css"/>
        <!-- progress barstle -->
        <link href="/css/css-circular-prog-bar.css" rel="stylesheet">
        <!-- fonts style -->
        <link href="https://fonts.googleapis.com/css?family=Poppins:400,700|Raleway:400,600&display=swap" rel="stylesheet">
        <!-- font wesome stylesheet -->
        <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
        <!-- Custom styles for this template -->
        <link href="/css/style.css" rel="stylesheet"/>
        <!-- Custom taskbar for this template -->
        <link href="/css/taskbar.css" rel="stylesheet"/>
        <!-- responsive style -->
        <link href="/css/responsive.css" rel="stylesheet"/>
        <link href="/css/Thi.css" rel="stylesheet"/>
        <link href="/css/BaiHoc.css" rel="stylesheet"/>

        <link href="/css/css-circular-prog-bar.css" rel="stylesheet">

        <script
                src="/js/jquery-1.js"></script>
        <script
                src="/js/baiTestReading.js"></script>
        <script src="http://code.jquery.com/jquery-1.7.1.min.js"
                type="text/javascript"></script>

        <script type="text/javascript">
            $(document).ready(function () {

            });
        </script>
    </head>

    <body class="sub_page">
        <div class="top_container ">
            <!-- header section strats -->
            <header th:replace="fragments/header :: header"></header>
        </div>
        <!-- end header section -->

        <div class="container mt-5">
            <h2>📊 Danh sách Kết quả Thi Chi tiết</h2>
            <table class="table table-striped table-hover table-bordered">
                <thead>
                <tr class="table-primary">
                    <th>STT</th>
                    <th>Họ và tên thí sinh</th>
                    <th>Tên bài thi</th>
                    <th>Ngày/Giờ làm bài</th>
                    <th>Điểm số</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="diem, status : ${DiemDTOS}">
                    <td th:text="${status.index + 1}">1</td>
                    <td th:text="${diem.fullName}">Nguyễn Văn A</td>
                    <td th:text="${diem.examName}">TOEIC Reading Test 1</td>
                    <td th:text="${diem.dateTest}">2025-12-10 10:30:00</td>
                    <td>
                        <span th:text="${#numbers.formatDecimal(diem.point, 1, 2)}">8.50</span>
                        <span th:if="${diem.point >= 8.0}" class="badge bg-success ms-2">Xuất sắc</span>
                        <span th:if="${diem.point < 5.0}" class="badge bg-danger ms-2">Chưa đạt</span>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(scores)}" class="alert alert-warning text-center" role="alert">
                Chưa có kết quả thi nào được ghi nhận.
            </div>
        </div>
        <!-- footer section -->

        <script src="/js/jquery-3.4.1.min.js" type="text/javascript"></script>
        <script src="/js/bootstrap.js" type="text/javascript"></script>

    </body>
</html>
