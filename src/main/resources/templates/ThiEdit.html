<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>

    <title>Chỉnh Sửa Bài Thi</title>

    <link href="/css/bootstrap.css" rel="stylesheet"/>
    <link href="/css/style.css" rel="stylesheet"/>
    <link href="/css/taskbar.css" rel="stylesheet"/>
    <link href="/css/responsive.css" rel="stylesheet"/>
    <link href="/css/Thi.css" rel="stylesheet"/>

    <script src="/js/jquery-3.4.1.min.js"></script>
</head>

<body class="sub_page">

<div class="top_container">
    <header th:replace="fragments/header :: header"></header>
</div>

<div class="container mt-5">
    <h2 class="ntitle">Chỉnh Sửa Bài Thi</h2>

    <!-- FORM EDIT -->
    <form method="post"
          th:action="@{'/thi/edit-exam/' + ${baiThi.examId}}"
          th:object="${baiThi}">

        <!-- TÊN BÀI THI -->
        <div class="form-group">
            <label>Tiêu Đề Bài Thi</label>
            <input type="text" class="form-control"
                   th:field="*{examName}" required>
        </div>

        <!-- NỘI DUNG -->
        <div class="form-group">
            <label>Nội Dung Bài Thi</label>
            <textarea class="form-control" rows="5"
                      th:field="*{content}" required></textarea>
        </div>

        <!-- THỜI GIAN -->
        <div class="form-group">
            <label>Thời Gian (phút)</label>
            <input type="number" class="form-control"
                   th:field="*{examTime}" required>
        </div>

        <hr>
        <h3>Câu Hỏi</h3>

        <!-- DANH SÁCH CÂU HỎI CŨ -->
        <div id="question-container">
            <div th:each="cauHoi, stat : *{listCauHoi}"
                 class="question-group"
                 th:id="'question-group-' + ${stat.index}">

                <input type="hidden"
                       th:name="'listCauHoi[' + ${stat.index} + '].questionId'"
                       th:value="${cauHoi.questionId}"/>

                <div class="form-group">
                    <label>Câu hỏi [[${stat.index + 1}]]</label>
                    <input type="text" class="form-control"
                           th:name="'listCauHoi[' + ${stat.index} + '].question'"
                           th:value="${cauHoi.question}" required>
                </div>

                <div class="form-group">
                    <label>Đáp án A</label>
                    <input type="text" class="form-control"
                           th:name="'listCauHoi[' + ${stat.index} + '].option1'"
                           th:value="${cauHoi.option1}" required>
                </div>

                <div class="form-group">
                    <label>Đáp án B</label>
                    <input type="text" class="form-control"
                           th:name="'listCauHoi[' + ${stat.index} + '].option2'"
                           th:value="${cauHoi.option2}" required>
                </div>

                <div class="form-group">
                    <label>Đáp án C</label>
                    <input type="text" class="form-control"
                           th:name="'listCauHoi[' + ${stat.index} + '].option3'"
                           th:value="${cauHoi.option3}" required>
                </div>

                <div class="form-group">
                    <label>Đáp án D</label>
                    <input type="text" class="form-control"
                           th:name="'listCauHoi[' + ${stat.index} + '].option4'"
                           th:value="${cauHoi.option4}" required>
                </div>

                <div class="form-group">
                    <label>Đáp Án Đúng</label>
                    <select class="form-control"
                            th:name="'listCauHoi[' + ${stat.index} + '].correctanswer'">
                        <option value="A" th:selected="${cauHoi.correctanswer == 'A'}">A</option>
                        <option value="B" th:selected="${cauHoi.correctanswer == 'B'}">B</option>
                        <option value="C" th:selected="${cauHoi.correctanswer == 'C'}">C</option>
                        <option value="D" th:selected="${cauHoi.correctanswer == 'D'}">D</option>
                    </select>
                </div>

                <button type="button"
                        class="btn btn-danger remove-question-btn"
                        th:data-id="'question-group-' + ${stat.index}">
                    Xóa câu hỏi
                </button>

                <hr>
            </div>
        </div>

        <button type="button" class="btn btn-secondary" id="add-question-btn">
            + Thêm Câu Hỏi
        </button>

        <br><br>
        <button type="submit" class="btn btn-primary">
            Lưu Thay Đổi
        </button>
    </form>
</div>

<script>
    let questionIndex = [[${baiThi.listCauHoi.size()}]];

    $('#add-question-btn').click(function () {
        let html = `
        <div class="question-group" id="question-group-${questionIndex}">
            <input type="hidden" name="listCauHoi[${questionIndex}].questionId">

            <div class="form-group">
                <label>Câu hỏi ${questionIndex + 1}</label>
                <input type="text" class="form-control"
                       name="listCauHoi[${questionIndex}].question" required>
            </div>

            <div class="form-group">
                <label>Đáp án A</label>
                <input type="text" class="form-control"
                       name="listCauHoi[${questionIndex}].option1" placeholder="" required>
            </div>

            <div class="form-group">
                <label>Đáp án B</label>
                <input type="text" class="form-control"
                       name="listCauHoi[${questionIndex}].option2" placeholder="" required>
            </div>

            <div class="form-group">
                <label>Đáp án C</label>
                <input type="text" class="form-control"
                       name="listCauHoi[${questionIndex}].option3" placeholder="" required>
            </div>

            <div class="form-group">
                <label>Đáp án D</label>
                <input type="text" class="form-control"
                       name="listCauHoi[${questionIndex}].option4" placeholder="" required>
            </div>
            <div>
                <label>Đáp án đúng</label>
                <select class="form-control"
                    name="listCauHoi[${questionIndex}].correctanswer">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
            </select>
            </div>

            <button type="button"
                    class="btn btn-danger remove-question-btn"
                    data-id="question-group-${questionIndex}">
                Xóa
            </button>
            <hr>
        </div>
        `;
        $('#question-container').append(html);
        questionIndex++;
    });

    $(document).on('click', '.remove-question-btn', function () {
        $('#' + $(this).data('id')).remove();
    });
</script>

</body>
</html>
